# Ecosystem names verified against GitHub's Dependabot options reference (package-ecosystem table):
# github-actions, docker, docker-compose, uv, terraform.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/staging
      - /infra/terraform/envs/prod
    schedule:
      interval: monthly
