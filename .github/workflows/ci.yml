name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts assets
      - run: uv run ruff format --check src tests scripts assets
      - run: uv run mypy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      # No secrets in CI: all LLM calls use the recorded FakeLLM; live tests are marked and skipped.
      - run: uv run pytest -q

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: bandit
        run: uv run bandit -q -r src -ll
      - name: pip-audit (locked runtime deps)
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --strict --progress-spinner off
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo -v --redact

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t tracedresearch:ci .
      # secrets are gitleaks' job; trivy's secret scanner flags a docstring inside the anthropic SDK (false positive)
      - name: trivy image scan (vulnerabilities)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          image --scanners vuln --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress
          tracedresearch:ci
      - name: CycloneDX SBOM of the image (trivy)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --format cyclonedx --output /out/tracedresearch-image.cdx.json --no-progress tracedresearch:ci
          python3 - <<'PY'
          import json
          d = json.load(open("sbom/tracedresearch-image.cdx.json"))
          assert d["bomFormat"] == "CycloneDX" and d.get("components"), "empty or non-CycloneDX SBOM"
          print(f"CycloneDX {d['specVersion']}: {len(d['components'])} components")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom/tracedresearch-image.cdx.json
          if-no-files-found: error

  # Full stack (redis + migrate job + api + worker) from the real image, deterministic fake LLM (ENV=ci only),
  # offline fixture corpus; then the same smoke script deploy.yml runs against staging and the prod canary.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.smoke.yml --profile api
      PORTFOLIO_ENV_FILE: /dev/null # the base compose file's local secrets path; nothing is read in CI
      LLM_SPEND_DIR: /tmp/llm-spend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: throwaway API key for this run (not a secret; generated, masked)
        run: |
          key="ci-$(openssl rand -hex 16)"
          echo "::add-mask::${key}"
          echo "SMOKE_API_KEY=${key}" >> "$GITHUB_ENV"
      - name: build the image and start the stack
        run: |
          $COMPOSE build
          $COMPOSE up -d
          $COMPOSE ps
      - name: smoke test (scripts/smoke.py)
        run: >
          python3 scripts/smoke.py --base-url http://127.0.0.1:8102 --worker-url http://127.0.0.1:8112
          --kill-switch-redis-url redis://127.0.0.1:16379/0 --expect-ssrf-fixture --wait-ready 120
          --json-out smoke-results/smoke_ci.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-results
          path: smoke-results/
          if-no-files-found: warn
      - name: compose logs (on failure)
        if: failure()
        run: $COMPOSE logs --no-color --timestamps
      - name: tear down
        if: always()
        run: $COMPOSE down -v

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: terraform init (no backend) + validate, both envs
        run: |
          for env in staging prod; do
            terraform -chdir="infra/terraform/envs/${env}" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/terraform/envs/${env}" validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: tflint (terraform + google rulesets)
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }} # read-only; avoids API rate limits when downloading the ruleset
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
      - name: checkov (terraform + workflows)
        run: |
          docker run --rm -v "$PWD:/repo" \
            bridgecrew/checkov@sha256:3cc125b5337717b7303dbddd4e79374c120687b5ff6a24f9abdad56b562469f3 \
            -d /repo/infra/terraform --framework terraform --quiet --compact
          docker run --rm -v "$PWD:/repo" \
            bridgecrew/checkov@sha256:3cc125b5337717b7303dbddd4e79374c120687b5ff6a24f9abdad56b562469f3 \
            -d /repo/.github/workflows --framework github_actions --quiet --compact
