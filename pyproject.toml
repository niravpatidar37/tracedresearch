[project]
name = "research-assistant"
version = "0.1.0"
description = "tracedresearch: crash-safe deep-research agent service (LangGraph supervisor + specialists, Redis-durable state, hard budgets, validated citations, step traces)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2,<2",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "fastapi>=0.161.1",
    "uvicorn>=0.32",
    "redis>=5.2",
    "ddgs>=9.0",
    "trafilatura>=2.0",
    "portalocker>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "ruff>=0.17.2",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]
"scripts/**" = ["S", "BLE", "E501"]
"assets/**" = ["S", "BLE", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["research_assistant"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: needs network + GROQ_API_KEY (skipped in CI)"]
addopts = "-m 'not live'"
